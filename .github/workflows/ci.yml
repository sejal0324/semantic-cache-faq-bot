name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make test
      # fake backends only: proves the pipeline runs end to end without network or keys
      - run: make smoke
      # eval gate: fail the build if measured numbers regress
      - run: make gate
